version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: betterbooks-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: betterbooks
      MYSQL_USER: betterbooks_user
      MYSQL_PASSWORD: betterbooks_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
